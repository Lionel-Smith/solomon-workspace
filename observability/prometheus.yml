global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          source: "claude-code"

  - job_name: "solomon-agents"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "host.docker.internal:8080"   # Solomon
          - "host.docker.internal:8082"   # Samson
          - "host.docker.internal:8084"   # Esther
          - "host.docker.internal:8086"   # Bishop
          - "host.docker.internal:8088"   # Jacob
        labels:
          source: "hfs-agents"
    metrics_path: "/_health"
